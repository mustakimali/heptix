[package]
name = "heptix"
version = "0.1.0"
edition = "2021"
description = "The missing haptic feedback for Linux: touchpad tap, click and scroll sounds"
license = "MIT"
repository = "https://github.com/mustakimali/heptix"
readme = "README.md"
keywords = ["touchpad", "haptic", "audio", "linux", "evdev"]
categories = ["command-line-utilities"]

[dependencies]
evdev = "0.13"
libc = "0.2"

[profile.release]
lto = true
strip = true
